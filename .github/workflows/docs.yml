name: Docs

# Generates browsable API documentation for every package and publishes
# it with GitHub Pages. The repository's Pages source must be set to
# "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate static docs with golds
        run: go run go101.org/golds@v0.8.7 -gen -dir=site -silent -nouses -only-list-exporteds -source-code-reading=plain -wdpkgs-listing=solo ./...
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
